substitutions:
  device_name: "greenhouse-tensiometer"
  friendly_name: "Greenhouse Tensiometer"
  device_ip: "192.168.10.161"
  s1_pin: "GPIO1"        # ADC1_CH0, non-strapping
  s2_pin: "GPIO2"        # ADC1_CH1, non-strapping
  update_interval: "30s"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "2x MMM tech TX-E tensiometers (kPa) via 10k/10k dividers on ADC1"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: arduino

logger:
  level: INFO
  logs:
    sensor: WARN
    api: WARN
    wifi: INFO
    ota: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none          # steadier ADC on the S3
  manual_ip:
    static_ip: ${device_ip}
    gateway: 192.168.10.1
    subnet: 255.255.255.0
    dns1: 192.168.10.1
  ap:
    ssid: "Tensiometer Fallback"
    password: !secret fallback_password

web_server:
  port: 80

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Oslo"
    servers:
      - pool.ntp.org
      - time.google.com

sensor:
  # ---- Raw divided pin voltages (internal, feed the kPa templates) ----
  - platform: adc
    id: t1_pin_v
    pin: ${s1_pin}
    attenuation: 12db
    update_interval: ${update_interval}
    internal: true
    filters:
      - sliding_window_moving_average: { window_size: 8, send_every: 1 }
  - platform: adc
    id: t2_pin_v
    pin: ${s2_pin}
    attenuation: 12db
    update_interval: ${update_interval}
    internal: true
    filters:
      - sliding_window_moving_average: { window_size: 8, send_every: 1 }

  # ---- Diagnostic: exposed pin voltage (for calibration / fault-spotting) ----
  - platform: template
    name: "1 Volts"
    id: t1_volts
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: ${update_interval}
    lambda: 'return id(t1_pin_v).state;'
  - platform: template
    name: "2 Volts"
    id: t2_volts
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: ${update_interval}
    lambda: 'return id(t2_pin_v).state;'

  # ---- Tension in kPa (INVERTED calibrate_linear; clamp 0..100) ----
  - platform: template
    name: "1 kPa"
    id: t1_kpa
    unit_of_measurement: "kPa"
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:gauge-low
    update_interval: ${update_interval}
    lambda: 'return id(t1_pin_v).state;'
    filters:
      - calibrate_linear:
          - 2.25 -> 0.0        # 4.5 V sensor  = wet
          - 0.25 -> 100.0      # 0.5 V sensor  = dry
      - lambda: |-
          if (isnan(x)) return x;
          if (x < 0.0f) x = 0.0f;
          if (x > 100.0f) x = 100.0f;
          return x;
  - platform: template
    name: "2 kPa"
    id: t2_kpa
    unit_of_measurement: "kPa"
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:gauge-low
    update_interval: ${update_interval}
    lambda: 'return id(t2_pin_v).state;'
    filters:
      - calibrate_linear:
          - 2.25 -> 0.0
          - 0.25 -> 100.0
      - lambda: |-
          if (isnan(x)) return x;
          if (x < 0.0f) x = 0.0f;
          if (x > 100.0f) x = 100.0f;
          return x;

  # ---- Zone average (NaN-safe) ----
  - platform: template
    name: "Average kPa"
    id: t_avg_kpa
    unit_of_measurement: "kPa"
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:gauge
    update_interval: ${update_interval}
    lambda: |-
      float a = id(t1_kpa).state;
      float b = id(t2_kpa).state;
      int n = 0; float sum = 0.0f;
      if (!isnan(a)) { sum += a; n++; }
      if (!isnan(b)) { sum += b; n++; }
      return n > 0 ? sum / n : NAN;

  # ---- Standard diagnostics ----
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    device_class: duration
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Status"
    device_class: connectivity
  - platform: template
    name: "1 Check Prime"
    id: t1_check_prime
    icon: mdi:water-alert
    # >~800 hPa (80 kPa): TX-E starts losing water
    lambda: |-
      if (isnan(id(t1_kpa).state)) return {};
      return id(t1_kpa).state > 80.0;
  - platform: template
    name: "2 Check Prime"
    id: t2_check_prime
    icon: mdi:water-alert
    lambda: |-
      if (isnan(id(t2_kpa).state)) return {};
      return id(t2_kpa).state > 80.0;

button:
  - platform: restart
    name: "Restart"
    entity_category: config

switch:
  - platform: safe_mode
    name: "Safe Mode"
    entity_category: config
