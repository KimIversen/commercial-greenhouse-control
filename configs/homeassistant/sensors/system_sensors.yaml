# System monitoring sensors via command line
- platform: command_line
  name: "CPU Usage"
  command: "top -bn1 | grep 'Cpu(s)' | awk '{print $2}' | sed 's/%us,//'"
  unit_of_measurement: "%"
  scan_interval: 60

- platform: command_line
  name: "Memory Usage"
  command: "free | grep Mem | awk '{printf \"%.1f\", $3/$2 * 100.0}'"
  unit_of_measurement: "%"
  scan_interval: 60

- platform: command_line
  name: "Disk Usage"
  command: "df -h / | awk 'NR==2{printf \"%s\", $5}' | sed 's/%//'"
  unit_of_measurement: "%"
  scan_interval: 60
