title: Greenhouse Control
views:
  # ==================== GREENHOUSE ====================
  - title: Greenhouse
    path: greenhouse
    icon: mdi:greenhouse
    cards:
      - type: markdown
        content: "# 🌱 Greenhouse"

      # --- Climate at a glance ---
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.greenhouse_climate_2_temperature
            name: Temperature
            needle: true
            min: 0
            max: 45
            severity:
              green: 18
              yellow: 25
              red: 30
          - type: gauge
            entity: sensor.greenhouse_climate_2_humidity
            name: Humidity
            needle: true
            min: 0
            max: 100
            severity:
              green: 40
              yellow: 70
              red: 85

      # --- Controls (Tapo plugs) ---
      - type: entities
        title: Controls
        show_header_toggle: false
        entities:
          - entity: switch.greenhouse_6_vanning
            name: "Vanning (#6)"
            icon: mdi:water
          - entity: switch.plugg_3_vifte_endevegg_ost
            name: "Vifte endevegg øst (#3)"
            icon: mdi:fan
          - entity: switch.plugg_5_vifte_endevegg_vest
            name: "Vifte endevegg vest (#5)"
            icon: mdi:fan

      # --- 24h history ---
      - type: history-graph
        title: "Temperature & Humidity (24h)"
        hours_to_show: 24
        entities:
          - entity: sensor.greenhouse_climate_2_temperature
            name: Temperature
          - entity: sensor.greenhouse_climate_2_humidity
            name: Humidity

      # --- Outdoor weather ---
      - type: weather-forecast
        entity: weather.forecast_hjem
        forecast_type: daily

  # ==================== SYSTEM & HEALTH ====================
  - title: System & Health
    path: system
    icon: mdi:heart-pulse
    cards:
      - type: entities
        title: Climate Sensor Health
        entities:
          - entity: binary_sensor.greenhouse_climate_2_device_status
            name: Online
          - entity: sensor.greenhouse_climate_2_wifi_signal
            name: WiFi Signal
          - entity: sensor.greenhouse_climate_2_uptime
            name: Uptime

      - type: entities
        title: Plug Health
        entities:
          - entity: binary_sensor.greenhouse_6_vanning_cloud_connection
            name: "Vanning (#6) – Cloud"
          - entity: sensor.greenhouse_6_vanning_signal_level
            name: "Vanning (#6) – Signal"
          - entity: binary_sensor.greenhouse_6_vanning_overheated
            name: "Vanning (#6) – Overheated"
          - type: divider
          - entity: binary_sensor.greenhouse_3_vifte_endevegg_cloud_connection
            name: "Vifte øst – Cloud"
          - entity: sensor.greenhouse_3_vifte_endevegg_signal_level
            name: "Vifte øst – Signal"
          - entity: binary_sensor.greenhouse_3_vifte_endevegg_overheated
            name: "Vifte øst – Overheated"
          - type: divider
          - entity: binary_sensor.greenhouse_5_vifte_endevegg_cloud_connection
            name: "Vifte vest – Cloud"
          - entity: sensor.greenhouse_5_vifte_endevegg_signal_level
            name: "Vifte vest – Signal"
          - entity: binary_sensor.greenhouse_5_vifte_endevegg_overheated
            name: "Vifte vest – Overheated"

      - type: entities
        title: Maintenance
        entities:
          - entity: input_button.manual_backup
            name: Manual Backup
          - entity: input_button.restart_homeassistant
            name: Restart Home Assistant
          - entity: sensor.backup_backup_manager_state
            name: Backup state

  # ==================== AUTOMATION ====================
  - title: Automation
    path: automation
    icon: mdi:robot
    cards:
      - type: entities
        title: Master
        entities:
          - entity: input_boolean.gh_automation_enabled
            name: Automation enabled
          - entity: switch.plugg_3_vifte_endevegg_ost
            name: Fan øst
          - entity: switch.plugg_5_vifte_endevegg_vest
            name: Fan vest
          - entity: switch.greenhouse_6_vanning
            name: Vanning
      - type: entities
        title: Thresholds (tune here)
        entities:
          - input_number.gh_fan_on_temp
          - input_number.gh_fan_off_temp
          - input_number.gh_humidity_max
          - input_number.gh_humidity_off
          - input_number.gh_overheat_temp
          - input_number.gh_overheat_critical
          - input_number.gh_cold_temp

  # ==================== METRICS ====================
  - title: Metrics
    path: metrics
    icon: mdi:chart-line
    cards:
      - type: entities
        title: 💧 Watering
        entities:
          - entity: input_datetime.gh_last_watering
            name: Last watering
          - entity: input_number.gh_last_watering_minutes
            name: Last duration
          - entity: sensor.gh_next_watering
            name: Next watering
          - entity: sensor.gh_water_per_plant_24h
            name: Water/plant (24h)
          - entity: sensor.gh_water_per_plant_7d_avg
            name: Water/plant (7-day avg)
      - type: entities
        title: 🌡️ Climate averages
        entities:
          - entity: sensor.gh_temp_avg_24h
            name: Temp avg (24h)
          - entity: sensor.gh_temp_avg_7d
            name: Temp avg (7-day)
          - entity: sensor.gh_temp_min_24h
            name: Temp min (24h)
          - entity: sensor.gh_temp_max_24h
            name: Temp max (24h)
          - entity: sensor.gh_humidity_min_24h
            name: Humidity min (24h)
          - entity: sensor.gh_humidity_max_24h
            name: Humidity max (24h)
      - type: gauge
        entity: sensor.gh_vpd
        name: VPD (kPa)
        min: 0
        max: 3.5
        needle: true
        severity:
          green: 0.8
          yellow: 1.2
          red: 1.6
      - type: entities
        title: 📊 Plant health
        entities:
          - entity: sensor.gh_dew_point
            name: Dew point
          - entity: sensor.gh_dewpoint_gap
            name: Temp − dew point gap
          - entity: sensor.gh_day_night_differential
            name: Day/night differential
          - entity: sensor.gh_pollination_window_pct_24h
            name: In pollination window (24h)
      - type: gauge
        entity: sensor.greenhouse_tensiometer_average_kpa
        name: Soil tension (avg)
        min: 0
        max: 50
        needle: true
        # PROVISIONAL bands — higher kPa = drier. Real setpoints come in Phase 2
        # from the crop-water-potential reference + the baseline.
        severity:
          green: 0
          yellow: 10
          red: 25
      - type: history-graph
        title: 🌱 Soil tension — dryback
        hours_to_show: 24
        entities:
          - entity: sensor.greenhouse_tensiometer_1_kpa
            name: Sensor 1
          - entity: sensor.greenhouse_tensiometer_2_kpa
            name: Sensor 2
          - entity: sensor.greenhouse_tensiometer_average_kpa
            name: Average
      - type: entities
        title: 🌱 Tensiometers
        entities:
          - entity: sensor.greenhouse_tensiometer_1_kpa
            name: Sensor 1 tension
          - entity: sensor.greenhouse_tensiometer_2_kpa
            name: Sensor 2 tension
          - entity: binary_sensor.greenhouse_tensiometer_1_check_prime
            name: Sensor 1 — refill/re-prime?
          - entity: binary_sensor.greenhouse_tensiometer_2_check_prime
            name: Sensor 2 — refill/re-prime?
