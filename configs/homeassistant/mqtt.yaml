# MQTT Sensor Configuration
# Topics: greenhouse/<location>/<zone>/temperature|humidity|status
# Add more sensors by copying a block and changing the topic/name.

sensor:
  # ==================== GREENHOUSE ====================

  # --- Row 1 ---
  - name: "Greenhouse Row 1 Temperature"
    state_topic: "greenhouse/grow/row1/temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    value_template: "{{ value | round(1) }}"

  - name: "Greenhouse Row 1 Humidity"
    state_topic: "greenhouse/grow/row1/humidity"
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    value_template: "{{ value | round(1) }}"

  # --- Row 2 ---
  - name: "Greenhouse Row 2 Temperature"
    state_topic: "greenhouse/grow/row2/temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    value_template: "{{ value | round(1) }}"

  - name: "Greenhouse Row 2 Humidity"
    state_topic: "greenhouse/grow/row2/humidity"
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    value_template: "{{ value | round(1) }}"

  # --- Row 3 ---
  - name: "Greenhouse Row 3 Temperature"
    state_topic: "greenhouse/grow/row3/temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    value_template: "{{ value | round(1) }}"

  - name: "Greenhouse Row 3 Humidity"
    state_topic: "greenhouse/grow/row3/humidity"
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    value_template: "{{ value | round(1) }}"

  # --- Row 4 ---
  - name: "Greenhouse Row 4 Temperature"
    state_topic: "greenhouse/grow/row4/temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    value_template: "{{ value | round(1) }}"

  - name: "Greenhouse Row 4 Humidity"
    state_topic: "greenhouse/grow/row4/humidity"
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    value_template: "{{ value | round(1) }}"

binary_sensor:
  # --- Greenhouse ---
  - name: "Greenhouse Row 1 Status"
    state_topic: "greenhouse/grow/row1/status"
    payload_on: "online"
    payload_off: "offline"
    device_class: connectivity

  - name: "Greenhouse Row 2 Status"
    state_topic: "greenhouse/grow/row2/status"
    payload_on: "online"
    payload_off: "offline"
    device_class: connectivity

  - name: "Greenhouse Row 3 Status"
    state_topic: "greenhouse/grow/row3/status"
    payload_on: "online"
    payload_off: "offline"
    device_class: connectivity

  - name: "Greenhouse Row 4 Status"
    state_topic: "greenhouse/grow/row4/status"
    payload_on: "online"
    payload_off: "offline"
    device_class: connectivity
