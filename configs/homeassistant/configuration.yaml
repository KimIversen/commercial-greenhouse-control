# Commercial Greenhouse Configuration
homeassistant:
  name: Commercial Greenhouse
  latitude: !secret latitude
  longitude: !secret longitude
  elevation: !secret elevation
  unit_system: metric
  time_zone: Europe/Oslo
  country: "NO"
  packages: !include_dir_named packages/

# HTTP
http:
  ip_ban_enabled: true
  login_attempts_threshold: 5

# Database - store everything for AI analysis later
recorder:
  db_url: !secret db_url
  purge_keep_days: 365
  auto_purge: true
  commit_interval: 1

# MQTT
mqtt: !include mqtt.yaml

# Essential components
api:
# Home Assistant Cloud (Nabu Casa) - remote access, no port forwarding required
cloud:
logger:
  default: warning
system_health:
mobile_app:
frontend:
config:
history:

# Lovelace YAML mode
lovelace:
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Greenhouse
      icon: mdi:greenhouse
      show_in_sidebar: true

# Include configuration files
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# System monitoring
sensor: !include sensors/system_sensors.yaml
binary_sensor: !include sensors/binary_sensors.yaml

# Manual controls
input_button: !include sensors/input_buttons.yaml
input_number: !include sensors/automation_numbers.yaml
input_boolean: !include sensors/automation_booleans.yaml

# Shell commands
shell_command:
  manual_backup: "/opt/greenhouse/scripts/backup.sh"
